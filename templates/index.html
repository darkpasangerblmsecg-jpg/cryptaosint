<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <title>CryptaOSINT | Advanced Intelligence Suite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
         --bg-gradient: linear-gradient(135deg, #0f0c1b 0%, #1a103c 50%, #090614 100%);
         --card-bg: rgba(26, 18, 51, 0.7);
         --border-color: rgba(168, 85, 247, 0.3);
         --accent-purple: #a855f7;
         --accent-pink: #ec4899;
         --accent-glow: rgba(168, 85, 247, 0.4);
         --text-main: #f8fafc;
         --text-muted: #cbd5e1;
      }
      
      body {
         background: var(--bg-gradient);
         background-attachment: fixed;
         color: var(--text-main);
         font-family: 'Nunito', sans-serif;
         min-height: 100vh;
         display: flex;
         flex-direction: column;
         justify-content: center;
         padding: 20px;
         position: relative;
         overflow-x: hidden;
      }

      /* Arka Planda Renkli Parlayan Işık Efektleri */
      .glow-orb {
         position: fixed;
         width: 400px;
         height: 400px;
         background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, rgba(236, 72, 153, 0.05) 60%, transparent 100%);
         border-radius: 50px;
         z-index: -1;
         animation: floatOrb 10s ease-in-out infinite alternate;
      }
      .orb-1 { top: -10%; left: -10%; }
      .orb-2 { bottom: -10%; right: -10%; animation-delay: -5s; }

      @keyframes floatOrb {
         0% { transform: translateY(0) scale(1); }
         100% { transform: translateY(30px) scale(1.1); }
      }

      .platform-wrapper { max-width: 900px; margin: auto; width: 100%; z-index: 1; }
      
      .brand-header { text-align: center; margin-bottom: 30px; }
      .brand-title {
         font-weight: 800; font-size: 2.8rem; letter-spacing: -0.5px;
         background: linear-gradient(135deg, #c084fc 0%, #ec4899 100%);
         -webkit-background-clip: text; -webkit-text-fill-color: transparent;
         filter: drop-shadow(0 2px 10px rgba(192, 132, 252, 0.3));
      }
      .brand-title i { -webkit-text-fill-color: #c084fc; margin-right: 5px; }
      .brand-subtitle { color: var(--text-muted); font-size: 0.95rem; font-weight: 600; }
      
      .main-card {
         background-color: var(--card-bg);
         backdrop-filter: blur(16px);
         border: 1px solid var(--border-color);
         border-radius: 24px; 
         padding: 35px;
         box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }

      .search-group {
         background: rgba(15, 12, 27, 0.8);
         border: 1px solid var(--border-color);
         border-radius: 14px;
         padding: 6px;
         transition: all 0.3s ease;
      }
      .search-group:focus-within {
         border-color: var(--accent-purple);
         box-shadow: 0 0 20px var(--accent-glow);
      }
      .search-group .form-control {
         background: transparent;
         border: none;
         color: #fff;
         padding: 12px 18px;
         font-family: 'Nunito', sans-serif;
         font-size: 1rem;
      }
      .search-group .form-control:focus {
         background: transparent;
         color: #fff;
         box-shadow: none;
      }
      .search-group .btn {
         background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
         border: none;
         padding: 12px 30px;
         font-weight: 700;
         border-radius: 10px;
         color: white;
         transition: opacity 0.2s, box-shadow 0.2s;
      }
      .search-group .btn:hover { 
         opacity: 0.9; 
         box-shadow: 0 0 15px rgba(236, 72, 153, 0.5);
      }
      
      .result-box {
         background-color: rgba(15, 12, 27, 0.6);
         border: 1px solid rgba(168, 85, 247, 0.2);
         border-radius: 12px;
         padding: 14px 18px;
         font-size: 0.95rem;
         color: #f1f5f9;
         margin-top: 6px;
         min-height: 52px;
         display: flex;
         flex-direction: column;
         justify-content: center;
         word-break: break-all;
         transition: border-color 0.2s;
      }
      .result-box:hover {
         border-color: rgba(168, 85, 247, 0.5);
      }
      
      .field-label { 
         font-size: 0.8rem; 
         font-weight: 800; 
         text-transform: uppercase; 
         letter-spacing: 1px; 
         color: #c084fc; 
      }
      
      .badge-custom {
         background: rgba(168, 85, 247, 0.2);
         color: #d8b4fe;
         border: 1px solid rgba(168, 85, 247, 0.4);
         padding: 4px 10px;
         border-radius: 8px;
         font-size: 0.8rem;
         font-weight: 700;
      }

      .footer-note { text-align: center; margin-top: 25px; font-size: 0.85rem; color: var(--text-muted); }
      #loader { display: none; text-align: center; padding: 25px; color: #c084fc; font-weight: 700; }
    </style>
</head>
<body>

<div class="glow-orb orb-1"></div>
<div class="glow-orb orb-2"></div>

<div class="platform-wrapper">
    <div class="brand-header">
        <h1 class="brand-title"><i class="fa-solid fa-shield-cat"></i> CryptaOSINT</h1>
        <p class="brand-subtitle">Next-Generation Open Source Reconnaissance Suite</p>
    </div>

    <div class="main-card">
        <div class="input-group search-group mb-4">
            <input type="text" id="targetInput" class="form-control" placeholder="IP, Domain, Username, Telefon, Discord ID veya E-posta girin...">
            <button class="btn btn-primary" onclick="performLookup()">
                <i class="fa-solid fa-magnifying-glass me-2"></i>Sorgula
            </button>
        </div>

        <div id="loader">
            <div class="spinner-border spinner-border-sm text-purple me-2" role="status"></div>
            <span>CryptaOSINT verileri tarıyor ve topluyor...</span>
        </div>

        <div class="row g-3" id="resultArea" style="display:none;">
            <div class="col-md-6">
                <div class="field-label" id="lbl1">Hedef</div>
                <div class="result-box" id="val1">-</div>
            </div>
            <div class="col-md-6">
                <div class="field-label" id="lbl2">Detay / Konum</div>
                <div class="result-box" id="val2">-</div>
            </div>
            <div class="col-md-6">
                <div class="field-label" id="lbl3">Sağlayıcı / Operatör</div>
                <div class="result-box" id="val3">-</div>
            </div>
            <div class="col-md-6">
                <div class="field-label" id="lbl4">Ek Bilgi / İzler</div>
                <div class="result-box" id="val4">-</div>
            </div>
        </div>
    </div>

    <div class="footer-note">
        <i class="fa-solid fa-lock me-1 text-purple"></i> CryptaOSINT Secure Recon Engine v3.1 &bull; Güvenli OSINT Paneli
    </div>
</div>

<script>
async function performLookup() {
    let target = document.getElementById('targetInput').value.trim();
    if(!target) return alert("Lütfen bir hedef belirtin!");
    
    let loader = document.getElementById('loader');
    let resultArea = document.getElementById('resultArea');
    
    loader.style.display = 'block';
    resultArea.style.display = 'none';
    
    try {
        let response = await fetch('/api/lookup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ target: target })
        });
        
        let data = await response.json();
        loader.style.display = 'none';
        
        if(!data.success) { alert(data.message); return; }

        resultArea.style.display = 'flex';

        if(data.type === "ip") {
            document.getElementById('lbl1').innerText = "IP Adresi & Organizasyon"; 
            document.getElementById('val1').innerHTML = `<span class="badge-custom">IPv4</span> ${data.ip} (${data.org})`;
            
            document.getElementById('lbl2').innerText = "Konum (Şehir / Ülke)"; 
            document.getElementById('val2').innerText = `${data.city}, ${data.region} / ${data.country}`;
            
            document.getElementById('lbl3').innerText = "Koordinatlar (Enlem / Boylam)"; 
            document.getElementById('val3').innerHTML = `Lat: <b>${data.latitude}</b>, Lon: <b>${data.longitude}</b> | <a href="https://www.google.com/maps/search/?api=1&query=${data.latitude},${data.longitude}" target="_blank" class="text-info text-decoration-none">[Haritada Aç]</a>`;
            
            document.getElementById('lbl4').innerText = "ISP Sağlayıcı & Reverse DNS"; 
            document.getElementById('val4').innerHTML = `<div>ISP: <b>${data.isp}</b></div><div>DNS: <span class="text-muted">${data.domain}</span></div>`;
        } 
        else if(data.type === "domain") {
            document.getElementById('lbl1').innerText = "Alan Adı (Domain)"; 
            document.getElementById('val1').innerHTML = `<span class="badge-custom">DNS</span> ${data.domain}`;
            document.getElementById('lbl2').innerText = "Çözümlenen IP"; 
            document.getElementById('val2').innerText = data.resolved_ip;
            document.getElementById('lbl3').innerText = "Aktif Kayıtlar"; 
            document.getElementById('val3').innerText = data.dns_raw.length + " kayıt bulundu";
            document.getElementById('lbl4').innerText = "Durum"; 
            document.getElementById('val4').innerText = "Aktif / Erişilebilir";
        }
        else if(data.type === "phone") {
            document.getElementById('lbl1').innerText = "Telefon Numarası"; 
            document.getElementById('val1').innerHTML = `<span class="badge-custom">PHONE</span> ${data.international}`;
            document.getElementById('lbl2').innerText = "Ülke / Bölge"; 
            document.getElementById('val2').innerText = data.country;
            document.getElementById('lbl3').innerText = "Operatör (Carrier)"; 
            document.getElementById('val3').innerText = data.carrier;
            document.getElementById('lbl4').innerText = "OSINT İzleri / Bağlantılar"; 
            document.getElementById('val4').innerHTML = `
                <a href="${data.footprints[0]}" target="_blank" class="text-info me-2 text-decoration-none">[Google]</a>
                <a href="${data.footprints[1]}" target="_blank" class="text-success me-2 text-decoration-none">[WhatsApp]</a>
                <a href="${data.footprints[2]}" target="_blank" class="text-primary text-decoration-none">[Telegram]</a>
            `;
        }
        else if(data.type === "discord") {
            document.getElementById('lbl1').innerText = "Discord Kullanıcı"; 
            document.getElementById('val1').innerHTML = `<span class="badge-custom">DISCORD</span> ${data.username}#${data.discriminator}`;
            document.getElementById('lbl2').innerText = "Hesap Açılış Tarihi"; 
            document.getElementById('val2').innerText = data.created_at;
            document.getElementById('lbl3').innerText = "Bot Durumu"; 
            document.getElementById('val3').innerText = data.bot ? "Evet (Bot)" : "Hayır (Normal Kullanıcı)";
            document.getElementById('lbl4').innerText = "Profil Avatarı"; 
            document.getElementById('val4').innerHTML = `<a href="${data.avatar}" target="_blank" class="text-info text-decoration-none">[Avatarı Tam Boyut Görüntüle]</a>`;
        }
        else if(data.type === "email") {
            document.getElementById('lbl1').innerText = "E-Posta Adresi"; 
            document.getElementById('val1').innerHTML = `<span class="badge-custom">EMAIL</span> ${data.email}`;
            
            document.getElementById('lbl2').innerText = "Reputasyon & Risk"; 
            let repColor = data.reputation === "high" ? "text-success" : (data.reputation === "low" ? "text-danger" : "text-warning");
            document.getElementById('val2').innerHTML = `Durum: <b class="${repColor}">${data.reputation.toUpperCase()}</b> | Şüpheli: <b>${data.suspicious ? "Evet ⚠️" : "Hayır ✅"}</b>`;
            
            document.getElementById('lbl3').innerText = "Alan Adı Özellikleri"; 
            document.getElementById('val3').innerText = `Geçici (Temp Mail): ${data.domain_details.disposable ? "Evet ⚠️" : "Hayır"} | Ücretsiz Sağlayıcı: ${data.domain_details.free_provider ? "Evet" : "Hayır"}`;
            
            let profilesHtml = "";
            if(data.profiles && data.profiles.length > 0) {
                data.profiles.forEach(p => {
                    profilesHtml += `<span class="badge bg-secondary me-1 mb-1">${p}</span>`;
                });
            } else {
                profilesHtml = "Halka açık ilişkilendirilmiş platform bulunamadı.";
            }
            document.getElementById('lbl4').innerText = "İlişkili Platformlar / İzler"; 
            document.getElementById('val4').innerHTML = profilesHtml;
        }
        else if(data.type === "username") {
            document.getElementById('lbl1').innerText = "Kullanıcı Adı"; 
            document.getElementById('val1').innerHTML = `<span class="badge-custom">USER</span> ${data.username}`;
            document.getElementById('lbl2').innerText = "Bulunan Platformlar"; 
            
            let accountsHtml = "";
            if(Object.keys(data.found_accounts).length === 0) {
                accountsHtml = "Eşleşen hesap bulunamadı.";
            } else {
                for (const [platform, url] of Object.entries(data.found_accounts)) {
                    accountsHtml += `<a href="${url}" target="_blank" class="badge bg-secondary text-decoration-none me-1 mb-1">${platform}</a> `;
                }
            }
            document.getElementById('val2').innerHTML = accountsHtml;
            document.getElementById('lbl3').innerText = "Tarama Durumu"; 
            document.getElementById('val3').innerText = "Tamamlandı";
            document.getElementById('lbl4').innerText = "Modül"; 
            document.getElementById('val4').innerText = "CryptaOSINT Suite";
        }
    } catch (err) {
        loader.style.display = 'none';
        alert("Bağlantı hatası: " + err);
    }
}
</script>

</body>
</html>
